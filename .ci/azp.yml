parameters:
  - name: name
    type: string
    default: ""
  - name: apt_packages
    type: string
    default: ""
  - name: depends_on
    type: object
    default: []
  - name: toolsets
    type: object
    default:
      - "gcc-16"
      - "gcc-15"
      - "gcc-14"
      - "gcc-13"
      - "gcc-12"
      - "gcc-11"
      - "gcc-9"
      - "gcc-8"
      - "gcc-7"
      - "gcc-6"
      - "gcc-5"
      - "gcc-4.9"
      - "gcc-4.8"
      - "clang-23"
      - "clang-22"
      - "clang-21"
      - "clang-20"
      - "clang-19"
      - "clang-18"
      - "clang-17"
      - "clang-16"
      - "clang-15"
      - "clang-14"
      - "clang-13"
      - "clang-12"
      - "clang-11"
      - "clang-10"
      - "clang-9"
      - "clang-8"
      - "clang-7"
      - "clang-6"
      - "clang-5"
      - "clang-4"
      - "clang-3.9"
      # - "tcc-0.9.27"
      - "clang-darwin-26.0"
      - "clang-darwin-16.4"
      - "clang-darwin-15.4"
      - "msvc-14.5"
      - "msvc-14.3"
      - "mingw-16"
      - "mingw-15"
      - "mingw-14"
      - "mingw-13"
      - "mingw-12"
  - name: b2_tests
    type: object
    default: []
  - name: cmake_tests
    type: object
    default: []

stages:
  - stage: "${{ parameters.name }}"
    dependsOn: ${{ parameters.depends_on }}
    jobs:
      - job: "Linux"
        condition: ${{ or( containsValue(parameters.toolsets,'gcc-16'),
          containsValue(parameters.toolsets,'gcc-15'),
          containsValue(parameters.toolsets,'gcc-14'),
          containsValue(parameters.toolsets,'gcc-13'),
          containsValue(parameters.toolsets,'gcc-12'),
          containsValue(parameters.toolsets,'gcc-11'),
          containsValue(parameters.toolsets,'gcc-10'),
          containsValue(parameters.toolsets,'gcc-9'),
          containsValue(parameters.toolsets,'gcc-8'),
          containsValue(parameters.toolsets,'gcc-7'),
          containsValue(parameters.toolsets,'gcc-6'),
          containsValue(parameters.toolsets,'gcc-5'),
          containsValue(parameters.toolsets,'gcc-4.9'),
          containsValue(parameters.toolsets,'gcc-4.8'),
          containsValue(parameters.toolsets,'clang-23'),
          containsValue(parameters.toolsets,'clang-22'),
          containsValue(parameters.toolsets,'clang-21'),
          containsValue(parameters.toolsets,'clang-20'),
          containsValue(parameters.toolsets,'clang-19'),
          containsValue(parameters.toolsets,'clang-18'),
          containsValue(parameters.toolsets,'clang-17'),
          containsValue(parameters.toolsets,'clang-16'),
          containsValue(parameters.toolsets,'clang-15'),
          containsValue(parameters.toolsets,'clang-14'),
          containsValue(parameters.toolsets,'clang-13'),
          containsValue(parameters.toolsets,'clang-12'),
          containsValue(parameters.toolsets,'clang-11'),
          containsValue(parameters.toolsets,'clang-10'),
          containsValue(parameters.toolsets,'clang-9'),
          containsValue(parameters.toolsets,'clang-8'),
          containsValue(parameters.toolsets,'clang-7'),
          containsValue(parameters.toolsets,'clang-6'),
          containsValue(parameters.toolsets,'clang-5'),
          containsValue(parameters.toolsets,'clang-4'),
          containsValue(parameters.toolsets,'clang-3.9'),
          containsValue(parameters.toolsets,'tcc-0.9.27') ) }}
        strategy:
          matrix:
            ${{ if containsValue( parameters.toolsets, 'gcc-16' ) }}:
              GCC 16:
                {
                  EXE: g++-16,
                  TOOLSET: gcc-16,
                  CXXSTD: "11,14,17,20,23",
                  CONTAINER: "teeks99/gcc-ubuntu:16",
                }
            ${{ if containsValue( parameters.toolsets, 'gcc-15' ) }}:
              GCC 15:
                {
                  EXE: g++-15,
                  TOOLSET: gcc-15,
                  CXXSTD: "11,14,17,20,23",
                  CONTAINER: "teeks99/gcc-ubuntu:15",
                }
            ${{ if containsValue( parameters.toolsets, 'gcc-14' ) }}:
              GCC 14:
                {
                  EXE: g++-14,
                  TOOLSET: gcc-14,
                  CXXSTD: "11,14,17,20,23",
                  CONTAINER: "teeks99/gcc-ubuntu:14",
                }
            ${{ if containsValue( parameters.toolsets, 'gcc-13' ) }}:
              GCC 13:
                {
                  EXE: g++-13,
                  TOOLSET: gcc-13,
                  CXXSTD: "11,14,17,20",
                  CONTAINER: "teeks99/gcc-ubuntu:13",
                }
            ${{ if containsValue( parameters.toolsets, 'gcc-12' ) }}:
              GCC 12:
                {
                  EXE: g++-12,
                  TOOLSET: gcc-12,
                  CXXSTD: "11,14,17,20",
                  CONTAINER: "teeks99/gcc-ubuntu:12",
                }
            ${{ if containsValue( parameters.toolsets, 'gcc-11' ) }}:
              GCC 11:
                {
                  EXE: g++-11,
                  TOOLSET: gcc-11,
                  CXXSTD: "11,14,17,20",
                  CONTAINER: "teeks99/gcc-ubuntu:11",
                }
            ${{ if containsValue( parameters.toolsets, 'gcc-10' ) }}:
              GCC 10:
                {
                  EXE: g++-10,
                  TOOLSET: gcc-10,
                  CXXSTD: "11,14,17",
                  CONTAINER: "teeks99/gcc-ubuntu:10",
                }
            ${{ if containsValue( parameters.toolsets, 'gcc-9' ) }}:
              GCC 9:
                {
                  EXE: g++-9,
                  TOOLSET: gcc-9,
                  CXXSTD: "11,14,17",
                  CONTAINER: "teeks99/gcc-ubuntu:9",
                }
            ${{ if containsValue( parameters.toolsets, 'gcc-8' ) }}:
              GCC 8:
                {
                  EXE: g++-8,
                  TOOLSET: gcc-8,
                  CXXSTD: "11,14,17",
                  CONTAINER: "teeks99/gcc-ubuntu:8",
                }
            ${{ if containsValue( parameters.toolsets, 'gcc-7' ) }}:
              GCC 7:
                {
                  EXE: g++-7,
                  TOOLSET: gcc-7,
                  CXXSTD: "11,14,17",
                  CONTAINER: "teeks99/gcc-ubuntu:7",
                }
            ${{ if containsValue( parameters.toolsets, 'gcc-6' ) }}:
              GCC 6:
                {
                  EXE: g++-6,
                  TOOLSET: gcc-6,
                  CXXSTD: "11,14,17",
                  CONTAINER: "teeks99/gcc-ubuntu:6",
                }
            ${{ if containsValue( parameters.toolsets, 'gcc-5' ) }}:
              GCC 5:
                {
                  EXE: g++-5,
                  TOOLSET: gcc-5,
                  CXXSTD: "11,14",
                  CONTAINER: "teeks99/gcc-ubuntu:5",
                }
            ${{ if containsValue( parameters.toolsets, 'gcc-4.9' ) }}:
              GCC 4.9:
                {
                  EXE: g++-4.9,
                  TOOLSET: gcc-4.9,
                  CXXSTD: "11",
                  CONTAINER: "teeks99/gcc-ubuntu:4.9",
                }
            ${{ if containsValue( parameters.toolsets, 'gcc-4.8' ) }}:
              GCC 4.8:
                {
                  EXE: g++-4.8,
                  TOOLSET: gcc-4.8,
                  CXXSTD: "11",
                  CONTAINER: "teeks99/gcc-ubuntu:4.8",
                }
            ${{ if containsValue( parameters.toolsets, 'clang-23' ) }}:
              Clang 23:
                {
                  EXE: clang++-23,
                  TOOLSET: clang-23,
                  CXXSTD: "11,14,17,20,23",
                  CONTAINER: "teeks99/clang-ubuntu:23",
                }
            ${{ if containsValue( parameters.toolsets, 'clang-22' ) }}:
              Clang 22:
                {
                  EXE: clang++-22,
                  TOOLSET: clang-22,
                  CXXSTD: "11,14,17,20,23",
                  CONTAINER: "teeks99/clang-ubuntu:22",
                }
            ${{ if containsValue( parameters.toolsets, 'clang-21' ) }}:
              Clang 21:
                {
                  EXE: clang++-21,
                  TOOLSET: clang-21,
                  CXXSTD: "11,14,17,20,23",
                  CONTAINER: "teeks99/clang-ubuntu:21",
                }
            ${{ if containsValue( parameters.toolsets, 'clang-20' ) }}:
              Clang 20:
                {
                  EXE: clang++-20,
                  TOOLSET: clang-20,
                  CXXSTD: "11,14,17,20,23",
                  CONTAINER: "teeks99/clang-ubuntu:20",
                }
            ${{ if containsValue( parameters.toolsets, 'clang-19' ) }}:
              Clang 19:
                {
                  EXE: clang++-19,
                  TOOLSET: clang-19,
                  CXXSTD: "11,14,17,20,23",
                  CONTAINER: "teeks99/clang-ubuntu:19",
                }
            ${{ if containsValue( parameters.toolsets, 'clang-18' ) }}:
              Clang 18:
                {
                  EXE: clang++-18,
                  TOOLSET: clang-18,
                  CXXSTD: "11,14,17,20,23",
                  CONTAINER: "teeks99/clang-ubuntu:18",
                }
            ${{ if containsValue( parameters.toolsets, 'clang-17' ) }}:
              Clang 17:
                {
                  EXE: clang++-17,
                  TOOLSET: clang-17,
                  CXXSTD: "11,14,17,20",
                  CONTAINER: "teeks99/clang-ubuntu:17",
                }
            ${{ if containsValue( parameters.toolsets, 'clang-16' ) }}:
              Clang 16:
                {
                  EXE: clang++-16,
                  TOOLSET: clang-16,
                  CXXSTD: "11,14,17,20",
                  CONTAINER: "teeks99/clang-ubuntu:16",
                }
            ${{ if containsValue( parameters.toolsets, 'clang-15' ) }}:
              Clang 15:
                {
                  EXE: clang++-15,
                  TOOLSET: clang-15,
                  CXXSTD: "11,14,17,20",
                  CONTAINER: "teeks99/clang-ubuntu:15",
                }
            ${{ if containsValue( parameters.toolsets, 'clang-14' ) }}:
              Clang 14:
                {
                  EXE: clang++-14,
                  TOOLSET: clang-14,
                  CXXSTD: "11,14,17,20",
                  CONTAINER: "teeks99/clang-ubuntu:14",
                }
            ${{ if containsValue( parameters.toolsets, 'clang-13' ) }}:
              Clang 13:
                {
                  EXE: clang++-13,
                  TOOLSET: clang-13,
                  CXXSTD: "11,14,17,20",
                  CONTAINER: "teeks99/clang-ubuntu:13",
                }
            ${{ if containsValue( parameters.toolsets, 'clang-12' ) }}:
              Clang 12:
                {
                  EXE: clang++-12,
                  TOOLSET: clang-12,
                  CXXSTD: "11,14,17",
                  CONTAINER: "teeks99/clang-ubuntu:12",
                }
            ${{ if containsValue( parameters.toolsets, 'clang-11' ) }}:
              Clang 11:
                {
                  EXE: clang++-11,
                  TOOLSET: clang-11,
                  CXXSTD: "11,14,17",
                  CONTAINER: "teeks99/clang-ubuntu:11",
                }
            ${{ if containsValue( parameters.toolsets, 'clang-10' ) }}:
              Clang 10:
                {
                  EXE: clang++-10,
                  TOOLSET: clang-10,
                  CXXSTD: "11,14,17",
                  CONTAINER: "teeks99/clang-ubuntu:10",
                }
            ${{ if containsValue( parameters.toolsets, 'clang-9' ) }}:
              Clang 9:
                {
                  EXE: clang++-9,
                  TOOLSET: clang-9,
                  CXXSTD: "11,14,17",
                  CONTAINER: "teeks99/clang-ubuntu:9",
                }
            ${{ if containsValue( parameters.toolsets, 'clang-8' ) }}:
              Clang 8:
                {
                  EXE: clang++-8,
                  TOOLSET: clang-8,
                  CXXSTD: "11,14,17",
                  CONTAINER: "teeks99/clang-ubuntu:8",
                }
            ${{ if containsValue( parameters.toolsets, 'clang-7' ) }}:
              Clang 7:
                {
                  EXE: clang++-7,
                  TOOLSET: clang-7,
                  CXXSTD: "11,14,17",
                  CONTAINER: "teeks99/clang-ubuntu:7",
                }
            ${{ if containsValue( parameters.toolsets, 'clang-6' ) }}:
              Clang 6:
                {
                  EXE: clang++-6.0,
                  TOOLSET: clang-6.0,
                  CXXSTD: "11,14,17",
                  CONTAINER: "teeks99/clang-ubuntu:6",
                }
            ${{ if containsValue( parameters.toolsets, 'clang-5' ) }}:
              Clang 5:
                {
                  EXE: clang++-5.0,
                  TOOLSET: clang-5.0,
                  CXXSTD: "11,14,17",
                  CONTAINER: "teeks99/clang-ubuntu:5",
                }
            ${{ if containsValue( parameters.toolsets, 'clang-4' ) }}:
              Clang 4:
                {
                  EXE: clang++-4.0,
                  TOOLSET: clang-4.0,
                  CXXSTD: "11,14",
                  CONTAINER: "teeks99/clang-ubuntu:4",
                }
            ${{ if containsValue( parameters.toolsets, 'clang-3.9' ) }}:
              Clang 3.9:
                {
                  EXE: clang++-3.9,
                  TOOLSET: clang-3.9,
                  CXXSTD: "11",
                  CONTAINER: "teeks99/clang-ubuntu:3.9",
                }
            ${{ if containsValue( parameters.toolsets, 'tcc-0.9.27' ) }}:
              TCC 0.9.27:
                {
                  EXE: tcc,
                  TOOLSET: cc,
                  B2_CONFIG: '<cflags>"-std=c11" <-soname>-soname',
                  CONTAINER: "ubuntu:24.04",
                }
        pool:
          vmImage: "ubuntu-latest"
        container:
          image: $[ variables['CONTAINER'] ]
          options: "--name container"
          # volumes: $[ variables['CO_VOLUMES'] ]
        steps:
          - task: CmdLine@2
            displayName: Sudorize
            target: host
            inputs:
              script: |
                /usr/bin/docker exec -t -u root container mv /etc/sudoers /etc/sudoers.bak
                /usr/bin/docker exec -t -u root container apt-get -qq update
                /usr/bin/docker exec -t -u root container apt-get -qq install sudo
                /usr/bin/docker exec -t -u root container mv /etc/sudoers.bak /etc/sudoers
          - bash: |
              APT_OPT="-o Acquire::Retries=3 -yq"
              sudo apt-get ${APT_OPT} update
              sudo apt-get ${APT_OPT} install wget software-properties-common ${{ parameters.apt_packages }}
            displayName: "Install Packages"
          - bash: |
              set -e
              pushd ${HOME}
              wget -nv https://github.com/bfgroup/b2/archive/main.tar.gz
              tar -zxf main.tar.gz
              cd b2-main
              ./bootstrap.sh
              sudo ./b2 --debug-configuration install
              EXE_PATH=`which ${EXE}`
              echo "using ${TOOLSET%%-[0-9]*} : : ${EXE_PATH} : ${B2_CONFIG} ;" > ${HOME}/user-config.jam
              popd
            displayName: "Install B2"
            condition: ${{ gt(length(parameters.b2_tests),0) }}
          - bash: |
              set -e
              pushd ${HOME}
              CMAKE_URL=`wget -q -O - https://api.github.com/repos/Kitware/cmake/releases/latest | grep browser_download_url | grep "linux-x86_64[.]tar[.]gz" | cut -d '"' -f 4`
              wget "${CMAKE_URL}" -O cmake.tgz
              tar zxvf cmake.tgz
              mv cmake-*-linux-x86_64 cmake
              popd
            displayName: "Install Cmake"
            condition: ${{ gt(length(parameters.cmake_tests),0) }}
          - ${{ each b2_test in parameters.b2_tests }}:
              - bash: |
                  set -e
                  pushd "${{ b2_test.dir }}"
                  b2 "--user-config=${HOME}/user-config.jam" ${TOOLSET:+toolset=$TOOLSET} cxxstd=${CXXSTD} ${{ b2_test.args }}
                  popd
                displayName: "${{ b2_test.name }}"
          - ${{ each cmake_test in parameters.cmake_tests }}:
              - bash: |
                  set -e
                  SOURCE=$PWD
                  mkdir -p "../${{ cmake_test.dir }}_build"
                  mkdir -p "../${{ cmake_test.dir }}_run"
                  pushd "../${{ cmake_test.dir }}_build"
                  ${HOME}/cmake/bin/cmake $SOURCE/${{ cmake_test.cml_dir }} ${{ cmake_test.args }} -DCMAKE_INSTALL_PREFIX=$SOURCE/../${{ cmake_test.dir }}_run -DCMAKE_PREFIX_PATH=$SOURCE/../${{ cmake_test.dir }}_run
                  make ${{ cmake_test.make_args }}
                  ${HOME}/cmake/bin/ctest
                  popd
                displayName: "${{ cmake_test.name }}"
      - job: "macOS"
        condition:
          ${{ or( containsValue(parameters.toolsets,'clang-darwin-26.0'),
          containsValue(parameters.toolsets,'clang-darwin-16.4'),
          containsValue(parameters.toolsets,'clang-darwin-15.4') ) }}
        strategy:
          matrix:
            ${{ if containsValue( parameters.toolsets, 'clang-darwin-26.0' ) }}:
              Xcode 26.0.1:
                {
                  EXE: clang++,
                  TOOLSET: clang,
                  XCODE_APP: /Applications/Xcode_26.0.1.app,
                  VM_IMAGE: "macOS-15",
                  CXXSTD: "11,14,17,20,23",
                }
            ${{ if containsValue( parameters.toolsets, 'clang-darwin-16.4' ) }}:
              Xcode 16.4:
                {
                  EXE: clang++,
                  TOOLSET: clang,
                  XCODE_APP: /Applications/Xcode_16.4.app,
                  VM_IMAGE: "macOS-15",
                  CXXSTD: "11,14,17,20",
                }
            ${{ if containsValue( parameters.toolsets, 'clang-darwin-15.4' ) }}:
              Xcode 15.4:
                {
                  EXE: clang++,
                  TOOLSET: clang,
                  XCODE_APP: /Applications/Xcode_15.4.app,
                  VM_IMAGE: "macOS-14",
                  CXXSTD: "11,14,17,20",
                }
        pool:
          vmImage: $[ variables['VM_IMAGE'] ]
        steps:
          - bash: |
              set -e
              uname -a
              sudo xcode-select -switch ${XCODE_APP}
              which clang++
              clang++ --version
            displayName: "Install CXX"
          - bash: |
              set -e
              pushd ${HOME}
              wget -nv https://github.com/bfgroup/b2/archive/main.tar.gz
              tar -zxf main.tar.gz
              cd b2-main
              CXX= ./bootstrap.sh
              sudo ./b2 install
              popd
            displayName: "Install B2"
          - ${{ each b2_test in parameters.b2_tests }}:
              - bash: |
                  set -e
                  CXX_PATH=`which ${EXE}`
                  echo "using ${TOOLSET} : : ${CXX_PATH} ;" > ${HOME}/user-config.jam
                  pushd "${{ b2_test.dir }}"
                  b2 "--user-config=${HOME}/user-config.jam" ${TOOLSET:+toolset=$TOOLSET} cxxstd=${CXXSTD} ${{ b2_test.args }}
                  popd
                displayName: "${{ b2_test.name }}"
      - job: "Windows"
        condition: ${{ or( containsValue(parameters.toolsets,'msvc-14.5'),
          containsValue(parameters.toolsets,'msvc-14.3') ) }}
        strategy:
          matrix:
            ${{ if containsValue( parameters.toolsets, 'msvc-14.5' ) }}:
              VS 2025:
                TOOLSET: msvc
                TOOLSET_VERSION: 14.5
                VM_IMAGE: "windows-2025-vs2026"
                CXXSTD: "14,17,20,latest"
            ${{ if containsValue( parameters.toolsets, 'msvc-14.3' ) }}:
              VS 2022:
                TOOLSET: msvc
                TOOLSET_VERSION: 14.3
                VM_IMAGE: "windows-2022"
                CXXSTD: "14,17,20"
            ${{ if containsValue( parameters.toolsets, 'mingw-16' ) }}:
              MinGW 16:
                TOOLSET: gcc
                TOOLSET_VERSION: 16.1.0
                VM_IMAGE: "windows-latest"
                CXXSTD: "11,14,17,20,23"
                MINGW_RT: "rt_v14-rev0"
            ${{ if containsValue( parameters.toolsets, 'mingw-15' ) }}:
              MinGW 15:
                TOOLSET: gcc
                TOOLSET_VERSION: 15.2.0
                VM_IMAGE: "windows-latest"
                CXXSTD: "11,14,17,20,23"
                MINGW_RT: "rt_v13-rev1"
            ${{ if containsValue( parameters.toolsets, 'mingw-14' ) }}:
              MinGW 14:
                TOOLSET: gcc
                TOOLSET_VERSION: 14.2.0
                VM_IMAGE: "windows-latest"
                CXXSTD: "11,14,17,20,23"
                MINGW_RT: "rt_v12-rev2"
            ${{ if containsValue( parameters.toolsets, 'mingw-13' ) }}:
              MinGW 13:
                TOOLSET: gcc
                TOOLSET_VERSION: 13.2.0
                VM_IMAGE: "windows-latest"
                CXXSTD: "11,14,17,20"
                MINGW_RT: "rt_v11-rev1"
            ${{ if containsValue( parameters.toolsets, 'mingw-12' ) }}:
              MinGW 12:
                TOOLSET: gcc
                TOOLSET_VERSION: 12.2.0
                VM_IMAGE: "windows-latest"
                CXXSTD: "11,14,17,20"
                MINGW_RT: "rt_v10-rev2"
        pool:
          vmImage: $[ variables['VM_IMAGE'] ]
        steps:
          - script: |
              cd %BUILD_SOURCESDIRECTORY%/..
              curl "https://github.com/niXman/mingw-builds-binaries/releases/download/%TOOLSET_VERSION%-%MINGW_RT%/x86_64-%TOOLSET_VERSION%-release-posix-seh-ucrt-%MINGW_RT%.7z" -L -o mingw.7z
            displayName: Download MinGW
            condition: eq(variables['TOOLSET'], 'gcc')
          - task: ExtractFiles@1
            inputs:
              archiveFilePatterns: $(Build.SourcesDirectory)/../mingw.7z
              destinationFolder: C:/
              cleanDestinationFolder: false
              overwriteExistingFiles: true
            displayName: Extract MinGW
            condition: eq(variables['TOOLSET'], 'gcc')
          - script: |
              cd %BUILD_SOURCESDIRECTORY%/..
              curl "https://github.com/bfgroup/b2/archive/main.zip" -L -o b2.zip
            displayName: Download B2
          - task: ExtractFiles@1
            inputs:
              archiveFilePatterns: $(Build.SourcesDirectory)/../b2.zip
              destinationFolder: $(Build.SourcesDirectory)/..
              cleanDestinationFolder: false
            displayName: Extract B2
          - script: |
              echo using %TOOLSET% ^: %TOOLSET_VERSION% ^; > %HOMEDRIVE%%HOMEPATH%/user-config.jam
              cd %BUILD_SOURCESDIRECTORY%/../b2-main
              cmd.exe /c bootstrap.bat
            displayName: Install B2
          - ${{ each b2_test in parameters.b2_tests }}:
              - script: |
                  set BOOST_BUILD_PATH=%BUILD_SOURCESDIRECTORY%/../b2-main
                  cd "%BUILD_SOURCESDIRECTORY%/${{ b2_test.dir }}"
                  %BUILD_SOURCESDIRECTORY%/../b2-main/b2.exe toolset=%TOOLSET% cxxstd=%CXXSTD% ${{ b2_test.args }}
                displayName: "${{ b2_test.name }}"
